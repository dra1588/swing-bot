name: h2-dev
# H2 development window (2007-2016) only. Safe to run repeatedly; the code refuses any date after 2016-12-31.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python -m swing_bot.h2_report --dev
