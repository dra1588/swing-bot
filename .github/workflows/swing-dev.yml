name: swing-dev
# Development-window report (2010-2019). Safe to run repeatedly; it never touches the OOS window result.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m swing_bot.report --dev
